<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="98" fill="#f1f5f9"/><text x="35" y="43" font-size="25" fill="#253247">No-net pin: terminal link</text><text x="35" y="77" font-size="17" fill="#253247">An unconnected pin still needs a terminal, but no net or trace.</text><rect x="834" y="20" width="136" height="45" rx="22" fill="#c92a2a"/><text x="863" y="50" font-size="21" fill="white">DEFECT</text><text x="60" y="133" font-size="15" fill="#64748b">EXPECTED</text><text x="60" y="166" font-size="22" fill="#253247">Reference resolves</text><text x="520" y="133" font-size="15" fill="#64748b">IMPORTED OUTPUT</text><text x="520" y="166" font-size="22" fill="#c92a2a">Dangling reference</text><rect x="65" y="210" width="345" height="180" rx="12" fill="#f1f5f9" stroke="#d8e0e9"/><text x="90" y="245" font-size="24" fill="#253247">PCB port</text><text x="90" y="287" font-size="18" fill="#253247">pcb_port_0</text><text x="90" y="325" font-size="17" fill="#64748b">source_port_id</text><text x="90" y="355" font-size="17" fill="#253247">pcb_component_0_port_1</text><path d="M 418 300 H 567" stroke="#c92a2a" stroke-width="4" stroke-dasharray="9 7"/><path d="M 552 289 l 17 11 -17 11" fill="none" stroke="#c92a2a" stroke-width="4"/><rect x="585" y="210" width="350" height="180" rx="12" fill="#fff5f5" stroke="#c92a2a"/><text x="610" y="245" font-size="24" fill="#253247">Source port</text><text x="610" y="287" font-size="17" fill="#253247">pcb_component_0_port_1</text><text x="610" y="343" font-size="26" fill="#c92a2a">MISSING</text><text x="80" y="457" font-size="20" fill="#253247">An unconnected terminal is still an element; no net is invented.</text><text x="35" y="541" font-size="16" fill="#64748b">Logical nets: 0   |   Logical traces: 0</text></g></svg>
