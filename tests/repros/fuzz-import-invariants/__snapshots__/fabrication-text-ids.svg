<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="98" fill="#f1f5f9"/><text x="35" y="43" font-size="25" fill="#253247">Fabrication text: element identity</text><text x="35" y="77" font-size="17" fill="#253247">Two distinct text elements need distinct, nonempty IDs.</text><rect x="834" y="20" width="136" height="45" rx="22" fill="#c92a2a"/><text x="863" y="50" font-size="21" fill="white">DEFECT</text><text x="60" y="133" font-size="15" fill="#64748b">EXPECTED</text><text x="60" y="166" font-size="22" fill="#253247">Two unique IDs</text><text x="520" y="133" font-size="15" fill="#64748b">IMPORTED OUTPUT</text><text x="520" y="166" font-size="22" fill="#c92a2a">Empty / duplicate IDs</text><rect x="60" y="190" width="420" height="265" rx="12" fill="#f1f5f9" stroke="#d8e0e9"/><text x="85" y="240" font-size="23" fill="#253247">Every text record has:</text><text x="85" y="295" font-size="20" fill="#253247">1. A nonempty primary ID</text><text x="85" y="340" font-size="20" fill="#253247">2. An ID distinct from other records</text><rect x="520" y="190" width="420" height="265" rx="12" fill="#fff5f5" stroke="#c92a2a"/><text x="545" y="240" font-size="22" fill="#253247">Fabrication note A</text><text x="545" y="277" font-size="17" fill="#c92a2a">&quot;&quot;  (empty string)</text><text x="545" y="340" font-size="22" fill="#253247">Fabrication note B</text><text x="545" y="377" font-size="17" fill="#c92a2a">&quot;&quot;  (empty string)</text><text x="35" y="541" font-size="16" fill="#64748b">The strings below are the actual primary IDs emitted by the importer.</text></g></svg>
